<!-- Welcome Modal -->
<div class="welcome-modal" *ngIf="showWelcomeModal">
  <div class="welcome-overlay"></div>
  <div class="welcome-content">
    <div class="welcome-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    </div>
    <h1 class="welcome-title">Jolayemi & Timileyin</h1>
    <p class="welcome-subtitle">We're Getting Married!</p>
    <p class="welcome-date">14 • 02 • 2026</p>
    <button class="welcome-btn" (click)="enterSite()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
      <span>Enter with Music</span>
    </button>
    <p class="welcome-hint">Tap to enter and enjoy the experience</p>
  </div>
</div>

<app-hero></app-hero>
