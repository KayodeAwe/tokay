<div class="pageBackground">
  <div class="contentInfo">
    <div class="gift-container">
      <div class="gift-header">
        <div class="gift-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 12 20 22 4 22 4 12"></polyline>
            <rect x="2" y="7" width="20" height="5"></rect>
            <line x1="12" y1="22" x2="12" y2="7"></line>
            <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
            <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
          </svg>
        </div>
        <h1 class="gift-title">Sending Gifts?</h1>
        <p class="gift-subtitle">All gifts should be monetized</p>
      </div>

      <div class="account-card">
        <div class="bank-logo">
          <span class="bank-name">Wema Bank</span>
        </div>

        <div class="account-details">
          <div class="account-number-section">
            <span class="label">Account Number</span>
            <div class="number-row">
              <span class="account-number">{{ accountNumber }}</span>
              <button class="copy-btn" (click)="copyAccountNumber()">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span>{{ copied ? 'Copied!' : 'Copy' }}</span>
              </button>
            </div>
          </div>

          <div class="account-name-section">
            <span class="label">Account Name</span>
            <span class="account-name">{{ accountName }}</span>
          </div>

          <div class="description-section">
            <span class="label">Description</span>
            <span class="description">{{ description }}</span>
          </div>
        </div>
      </div>

      <div class="thank-you">
        <p>Thank you for your love and support 💕</p>
      </div>
    </div>
  </div>
</div>
